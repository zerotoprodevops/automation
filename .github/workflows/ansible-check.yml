##Step 1: name your pipeline and tell whe to run   
name: Ansible Validation

on: 
  push:
    branches: [ "main" ]
    paths:
      - 'ansible-server-baseline/**'
  pull_request:
    branches: [ "main" ]
  

## Step 2: Define Job and what OS it will run on

jobs:
  test-ansible:
    runs-on: ubuntu-latest
  
    defaults:
      run:
        working-directory: ./ansible-server-baseline

## step 3: use pre-built actions to download code and python
## Getting the tools
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

##layer 4: Run the commands
      - name: Install Ansible and Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name:  Run syntax Check
        run: |
          # Create a dummy vault password 
          echo "dummy_pass" >  vault_pass.txt
          ansible-playbook site.yaml -i my_inventory/dev  --syntax-check --vault-password-file vault_pass.txt
       

